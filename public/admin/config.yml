# =============================================================================
#  KONFIGURASI PANEL KONTEN
# =============================================================================
#
#  Berkas ini menentukan form apa saja yang muncul di halaman /admin.
#  Boleh diedit tangan. Setiap "collection" menjadi satu menu di sisi kiri
#  panel, dan setiap "field" menjadi satu isian di dalam form.
#
#  Alur kerjanya: kamu menyimpan perubahan di panel, panel menulis commit ke
#  repositori GitHub, lalu Vercel membangun ulang situsnya sendiri.
#
#  ---------------------------------------------------------------------------
#  SUSUNAN MENUNYA
#
#    Tulisan Blog        satu tulisan satu berkas
#
#    Isi Halaman         urutannya sama dengan urutan bagian di halaman, dari
#                        atas ke bawah. Halaman Depan, Tentang Saya, Angka
#                        Sorotan, Bahasa, Pengalaman, Proyek, Publikasi,
#                        Keahlian, Sertifikasi, Pendidikan, Kesukarelawanan,
#                        Galeri, Kontak, Layanan.
#
#    Pengaturan Situs    hal hal yang mengatur cara situs bekerja, bukan isinya
#
#    Masukan Masuk       kiriman dari tamu lewat formulir di situs
#
#  Aturan yang dipegang di sini: satu menu untuk satu berkas di folder
#  content/, dan namanya sama dengan nama bagian yang dilihat pengunjung.
#  Dua menu tidak boleh menunjuk ke berkas yang sama, karena menyimpan salah
#  satunya akan menghapus kolom yang tidak ikut terdaftar di menu itu.
#  ---------------------------------------------------------------------------
#
#  Petunjuk lengkap ada di data/README.md bagian 17.
# =============================================================================

# -----------------------------------------------------------------------------
#  TAMPILAN PANELNYA SENDIRI
# -----------------------------------------------------------------------------
#  Dua baris ini mengganti tulisan "Sveltia CMS" dan gambar bawaannya yang
#  muncul di halaman masuk, di pojok kiri atas panel, dan di judul tab peramban.
#
#  Judulnya TIDAK ditulis di sini. Yang dipakai adalah isian di panel, menu
#  Pengaturan Situs > Nama Situs dan SEO > Judul panel. Kalau kosong, dipakai
#  namamu. Nilai di bawah cuma cadangan kalau berkas judulnya belum terbuat,
#  misalnya saat repositori baru di-clone dan npm install belum dijalankan.
#
#  Lihat scripts/copy-cms.mjs untuk alasan lengkapnya.
app_title: "Panel Konten"

logo:
  # Sengaja menunjuk ke /icon.png, dan itu bukan berkas sembarangan.
  #
  # Berkas itu dibuat ulang otomatis tiap kali situs dibangun, dari gambar yang
  # kamu pilih di menu Pengaturan Situs > Nama Situs dan SEO > Ikon situs.
  # Artinya, ganti ikon situsnya lewat panel, dan gambar di halaman masuk panel
  # ikut berganti sendiri. Tidak ada berkas kedua yang perlu kamu urus, dan
  # tidak ada yang perlu diedit di sini.
  #
  # Lihat scripts/generate-favicon.mjs.
  src: /icon.png

  # Gambarnya tidak ikut ditampilkan di bilah atas panel. Di halaman masuk dia
  # besar dan memang jadi penanda, tapi di bilah atas dia cuma menyempitkan
  # ruang untuk kotak pencarian tanpa memberi keterangan apa pun.
  show_in_header: false

backend:
  name: github
  repo: Rianfirnanda/Portofolio
  branch: main
  # Endpoint login ada di proyek Vercel yang sama, lihat app/api/auth/route.js
  base_url: https://rianfirnanda.vercel.app
  auth_endpoint: api/auth/
  commit_messages:
    create: "konten: tambah {{collection}} lewat panel"
    update: "konten: perbarui {{collection}} lewat panel"
    delete: "konten: hapus {{collection}} lewat panel"
    uploadMedia: "konten: unggah {{path}} lewat panel"
    deleteMedia: "konten: hapus {{path}} lewat panel"

# Bekerja langsung di branch main, jadi setiap simpan langsung tayang.
publish_mode: simple

# Tempat semua berkas yang kamu unggah lewat panel disimpan. Namanya "media"
# dan bukan "images" karena isinya bukan cuma gambar: video, musik, dan PDF
# semuanya masuk ke sini juga.
media_folder: "public/media"
public_folder: "/media"

# Batas ukuran satu berkas: 10 MB.
#
# Angka ini diturunkan dari 40 MB setelah unggahan sering gagal. Sebabnya
# begini: setiap berkas dikirim ke GitHub lewat sambungan internetmu sebagai
# satu paket utuh. Berkas besar di jaringan ponsel sering putus di tengah jalan,
# dan yang terlihat cuma pesan gagal tanpa penjelasan.
#
# Dengan batas 10 MB, berkas yang jelas terlalu besar ditolak lebih awal dengan
# pesan yang jelas, bukan gagal setelah kamu menunggu lama.
#
# TIGA HAL YANG MEMBUAT UNGGAHAN LEBIH LANCAR
#   1. Unggah satu berkas dulu, tunggu selesai, baru berkas berikutnya.
#      Beberapa unggahan sekaligus bisa saling berebut dan salah satu gagal.
#   2. Foto tidak perlu ukuran asli kamera. Situs memperkecilnya sendiri, jadi
#      lebar 1600 piksel sudah lebih dari cukup dan ukurannya jauh lebih ringan.
#   3. Video panjang unggah ke YouTube, lalu tempel tautannya di tulisan.
media_libraries:
  default:
    config:
      max_file_size: 10485760

      # FOTO DIPERKECIL OTOMATIS SAAT DIUNGGAH
      #
      # Ini yang membuat panel tidak lagi berat di ponsel.
      #
      # Foto dari kamera ponsel biasanya 12 megapiksel atau lebih. Saat panel
      # menampilkan daftar media, tiap foto harus dibongkar dulu di memori, dan
      # satu foto sebesar itu memakan sekitar 48 MB RAM. Dengan puluhan foto
      # sekaligus, memori Chrome di ponsel habis dan tabnya ditutup paksa.
      #
      # Sekarang foto diperkecil di ponselmu sendiri sebelum dikirim. Berkas
      # 5 MB dari kamera biasanya menyusut jadi sekitar 300 KB. Lebar 2000
      # piksel masih jauh di atas kebutuhan tampilan mana pun di situs ini.
      #
      # Efek sampingnya bagus: unggahannya juga jadi jauh lebih cepat dan
      # lebih jarang gagal, karena yang dikirim jauh lebih kecil.
      transformations:
        raster_image:
          width: 2000
          quality: 82

collections:
  # ------------------------------------------------------------------------
  # TULISAN BLOG
  #
  # Yang perlu kamu isi cuma judul, tanggal, dan isi tulisannya. Sisanya
  # opsional. Tiga hal ini dihitung sendiri oleh situs, jadi tidak ada di sini:
  #
  #   alamat tulisan   dibuat dari judul
  #   waktu baca       dihitung dari panjang tulisan
  #   ringkasan        diambil dari kalimat pertama kalau dikosongkan
  # ------------------------------------------------------------------------
  - name: "posts"
    label: "Tulisan Blog"
    icon: "edit_note"
    label_singular: "Tulisan"
    folder: "content/posts"
    create: true
    format: "json"
    extension: "json"
    slug: "{{fields.title.id}}"
    summary: "{{fields.title.id}}"
    sortable_fields: ["date"]
    fields:
      - label: "Judul"
        name: "title"
        widget: object
        collapsed: false
        required: true
        hint: "Alamat tulisannya dibuat otomatis dari judul ini."
        fields:
          - { label: "Bahasa Indonesia", name: "id", widget: "string", required: true }
          - { label: "English (opsional)", name: "en", widget: "string", required: false, hint: "Kosongkan saja kalau tidak perlu. Nanti dipakai judul Indonesianya." }

      - { label: "Tanggal terbit", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }

      - label: "Isi tulisan"
        name: "body"
        widget: object
        collapsed: false
        required: true
        hint: "Tulis biasa saja. Untuk menyisipkan foto, video, musik, atau PDF, klik tombol gambar di bilah alat lalu pilih berkasnya."
        fields:
          - label: "Bahasa Indonesia"
            name: "id"
            widget: "markdown"
            required: true
            modes: ["rich_text", "raw"]
            buttons: ["bold", "italic", "code", "quote", "bulleted-list", "numbered-list", "link"]
            editor_components: ["sisip-audio", "sisip-video", "sisip-dokumen", "image"]
          - label: "English (opsional)"
            name: "en"
            widget: "markdown"
            required: false
            modes: ["rich_text", "raw"]
            buttons: ["bold", "italic", "code", "quote", "bulleted-list", "numbered-list", "link"]
            editor_components: ["sisip-audio", "sisip-video", "sisip-dokumen", "image"]
            hint: "Kosongkan saja kalau tidak perlu versi Inggris."

      - label: "Audio pendamping"
        name: "audio"
        widget: object
        collapsed: true
        required: false
        hint: "Pemutar yang menempel di bawah judul artikel, seperti tombol dengarkan di Substack. Kosongkan kalau tulisan ini tidak punya audio."
        fields:
          - { label: "Berkas audio", name: "file", widget: "file", required: false, accept: ".mp3,.m4a,.aac,.wav,.flac,.ogg,.oga,.opus,.weba", hint: "Bisa mp3, m4a, aac, wav, flac, ogg, oga, opus, atau weba. Empat yang pertama paling aman, jalan di semua perangkat termasuk iPhone. Kosongkan untuk menyembunyikan pemutarnya." }
          - label: "Jenis audio"
            name: "kind"
            widget: "select"
            required: false
            default: "narasi"
            hint: "Menentukan ikon dan tulisan bawaan pada pemutarnya."
            options:
              - { label: "Narasi, rekaman kamu membacakan tulisan ini", value: "narasi" }
              - { label: "Podcast, obrolan yang jadi dasar tulisan", value: "podcast" }
              - { label: "Lagu, musik penemani membaca", value: "lagu" }
          - label: "Judul pemutar"
            name: "title"
            widget: object
            collapsed: false
            required: false
            hint: "Kosongkan untuk memakai tulisan bawaan sesuai jenis di atas."
            fields:
              - { label: "Bahasa Indonesia", name: "id", widget: "string", required: false }
              - { label: "English (opsional)", name: "en", widget: "string", required: false }
          - label: "Putar sendiri saat tulisan dibuka"
            name: "autoplay"
            widget: "boolean"
            required: false
            default: true
            hint: "Pembaca yang mengeklik tulisan ini dari daftar blog akan langsung mendengarnya. Pembaca yang membuka alamatnya langsung dari Google baru mendengarnya setelah menyentuh halaman, karena semua peramban melarang suara keluar sebelum itu. Matikan kalau tulisan ini sebaiknya dibaca dalam sunyi."
          - label: "Mulai dari menit"
            name: "start"
            widget: "string"
            required: false
            pattern: ["^$|^[0-9]{1,2}(:[0-5][0-9]){1,2}$", "Tulis seperti 1:30 untuk menit satu lewat tiga puluh detik."]
            hint: "Contoh 1:30. Kosongkan untuk memutar dari awal lagu."
          - label: "Berhenti di menit"
            name: "end"
            widget: "string"
            required: false
            pattern: ["^$|^[0-9]{1,2}(:[0-5][0-9]){1,2}$", "Tulis seperti 3:05 untuk menit tiga lewat lima detik."]
            hint: "Contoh 3:05. Kosongkan untuk memutar sampai lagunya habis. Diabaikan kalau isinya lebih awal daripada kolom di atas."
          - label: "Ulangi terus potongan ini"
            name: "loop"
            widget: "boolean"
            required: false
            default: false
            hint: "Begitu sampai menit berhenti, musiknya kembali ke menit mulai dan berputar lagi. Berguna kalau potongannya pendek sedangkan tulisannya panjang."

      - { label: "Gambar sampul", name: "cover", widget: "image", required: false, hint: "Bentuk mendatar paling pas. Kosongkan untuk memakai latar gradien otomatis." }

      - label: "Keterangan gambar sampul"
        name: "coverAlt"
        widget: object
        collapsed: true
        required: false
        hint: "Menjelaskan isi gambar untuk pembaca yang tidak bisa melihatnya."
        fields:
          - { label: "Bahasa Indonesia", name: "id", widget: "string", required: false }
          - { label: "English (opsional)", name: "en", widget: "string", required: false }

      - { label: "Topik", name: "tags", widget: "list", required: false, label_singular: "Topik", hint: "Otomatis jadi tombol penyaring di halaman blog. Contoh: Tata Kelola, Dokumentasi." }

      - label: "Ringkasan (opsional)"
        name: "excerpt"
        widget: object
        collapsed: true
        required: false
        hint: "Tampil di kartu daftar dan di hasil pencarian Google. Kosongkan saja, nanti diambil dari kalimat pertama tulisanmu."
        fields:
          - { label: "Bahasa Indonesia", name: "id", widget: "text", required: false }
          - { label: "English (opsional)", name: "en", widget: "text", required: false }

      - { label: "Jadikan sorotan", name: "featured", widget: "boolean", default: false, required: false, hint: "Memberi kartu tulisan ini bingkai gradien beranimasi." }
      - { label: "Simpan sebagai draf", name: "draft", widget: "boolean", default: false, required: false, hint: "Draf tersimpan tapi belum tampil di situs. Hilangkan centangnya kalau sudah siap terbit." }
  # ------------------------------------------------------------------------
  # ISI HALAMAN
  #
  # Urutan menu di bawah sama dengan urutan bagiannya di halaman, dari atas ke
  # bawah. Jadi kalau kamu ingin mengubah sesuatu, cari saja menu yang namanya
  # sama dengan bagian yang kamu lihat di situs.
  # ------------------------------------------------------------------------
  - name: "isi"
    label: "Isi Halaman"
    icon: "web"
    files:

      # ------------------------------------------------------------------------
      # HALAMAN DEPAN
      #
      # Semua yang terlihat pengunjung sebelum menggulir sedikit pun. Urutan
      # kolom di bawah sengaja dibuat sama dengan urutan tampilnya di layar,
      # dari atas ke bawah, supaya gampang dicocokkan.
      #
      # Ringkasan dan strip foto kegiatan tidak ada di sini. Keduanya milik
      # bagian Tentang Saya dan punya menunya sendiri di bawah.
      # ------------------------------------------------------------------------
      - name: "profile"
        label: "Halaman Depan"
        icon: "home"
        file: "content/profile.json"
        fields:
          - { label: "Nama lengkap", name: "name", widget: "string", required: true, hint: "Tampil besar di halaman depan." }
          - { label: "Nama panggilan", name: "shortName", widget: "string", required: true, hint: "Tampil di navbar, di sebelah foto kecil." }
          - label: "Status ketersediaan"
            name: "availability"
            widget: object
            collapsed: false
            hint: "Kapsul kecil paling atas, di atas namamu."
            fields:
              - { label: "Tampilkan titik berkedip", name: "available", widget: "boolean", default: true, hint: "Hilangkan centangnya kalau kamu ingin teksnya saja, tanpa titik di sebelah kiri." }
              - label: "Teks status"
                name: "label"
                widget: object
                collapsed: false
                required: true
                hint: "Bebas kamu tulis apa saja. Contoh: Terbuka untuk peluang kerja, Sedang menyelesaikan skripsi, Sibuk sampai Desember, atau Terbuka untuk kolaborasi riset. Kosongkan keduanya untuk menyembunyikan seluruh kapsul status."
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: true }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }
              - { label: "Warna titik", name: "dotColor", widget: "color", required: false, allowInput: true, default: "#10b981", hint: "Warna bebas. Yang lazim dipakai: hijau #10b981 untuk terbuka, kuning #f59e0b untuk sedang sibuk, merah #ef4444 untuk tidak tersedia, biru #3b82f6 untuk kabar netral. Pilih warna yang cukup terang supaya tetap terlihat di mode gelap maupun terang." }
          - label: "Headline"
            name: "headline"
            widget: object
            collapsed: false
            required: true
            hint: "Kalimat besar tepat di bawah namamu."
            fields:
              - { label: "Bahasa Indonesia", name: "id", widget: "text", required: true }
              - { label: "English (opsional)", name: "en", widget: "text", required: false }
          - label: "Kalimat pembuka"
            name: "tagline"
            widget: object
            collapsed: false
            required: false
            hint: "Kalimat personal singkat di bawah headline, bergaris di sebelah kiri."
            fields:
              - { label: "Bahasa Indonesia", name: "id", widget: "text", required: false }
              - { label: "English (opsional)", name: "en", widget: "text", required: false }
          - { label: "Lokasi", name: "location", widget: "string", required: true, hint: "Tampil dengan ikon peta di bawah kalimat pembuka. Contoh: Bengkulu, Indonesia" }
          - { label: "Tautan tombol Unduh CV", name: "resumeUrl", widget: "file", required: false, accept: ".pdf,.doc,.docx", choose_url: true, hint: "Unggah berkas CV kamu, atau tempel alamat web seperti tautan LinkedIn. Kosongkan untuk menyembunyikan tombolnya." }
          - { label: "Foto profil", name: "avatar", widget: "image", hint: "Bentuk persegi, minimal 640x640 piksel." }
          - label: "Kartu pada foto"
            name: "photoCard"
            widget: object
            collapsed: false
            required: false
            hint: "Kotak kecil yang menempel di bagian bawah foto profil. Isinya cuma dua baris ini."
            fields:
              - { label: "Nama yang tampil", name: "name", widget: "string", required: false, hint: "Kosongkan untuk memakai nama lengkap di atas." }
              - label: "Motto"
                name: "motto"
                widget: object
                collapsed: false
                required: false
                hint: "Satu kalimat pendek. Kosongkan kalau kamu ingin namanya saja yang tampil."
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: false }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }

      # ------------------------------------------------------------------------
      # TENTANG SAYA
      #
      # Bagian kedua halaman, tepat di bawah halaman depan. Isinya paragraf
      # ringkasan dan strip foto kegiatan di bawahnya.
      #
      # Angka sorotan dan daftar bahasa juga tampil di bagian ini, tetapi
      # keduanya berupa daftar sendiri, jadi menunya terpisah di bawah.
      # ------------------------------------------------------------------------
          - label: "Keterangan foto untuk pembaca layar"
            name: "avatarAlt"
            widget: object
            collapsed: false
            required: true
            hint: "Dibacakan untuk pengunjung tunanetra. Tidak tampil di layar."
            fields:
              - { label: "Bahasa Indonesia", name: "id", widget: "string", required: true }
              - { label: "English (opsional)", name: "en", widget: "string", required: false }
          - { label: "Foto cadangan", name: "avatarFallback", widget: "image", required: false, hint: "Dipakai hanya kalau foto utama gagal dimuat. Boleh diisi foto yang sama." }
      - name: "about"
        label: "Tentang Saya"
        icon: "person"
        file: "content/about.json"
        fields:
          - { label: "Ringkasan, Bahasa Indonesia", name: "summaryId", widget: "list", label_singular: "Paragraf", field: { label: "Paragraf", name: "text", widget: "text" }, hint: "Satu baris sama dengan satu paragraf." }
          - { label: "Ringkasan, English", name: "summaryEn", widget: "list", required: false, label_singular: "Paragraph", field: { label: "Paragraph", name: "text", widget: "text" }, hint: "Boleh dikosongkan kalau kamu hanya ingin versi Indonesia." }
          - label: "Sekilas Kegiatan"
            name: "gallery"
            widget: list
            collapsed: true
            minimize_collapsed: true
            required: false
            label_singular: "Foto"
            hint: "Strip tiga foto di bawah ringkasan. Ini BUKAN bagian Galeri. Yang ini isinya sedikit dan tiap foto wajib berketerangan. Untuk kumpulan foto yang banyak, pakai menu Galeri di bawah."
            fields:
              - { label: "Berkas gambar", name: "src", widget: "image" }
              - label: "Keterangan untuk pembaca layar"
                name: "alt"
                widget: object
                collapsed: false
                required: true
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: true }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }
              - label: "Keterangan di atas gambar"
                name: "caption"
                widget: object
                collapsed: false
                required: true
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: true }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }

      # Empat kotak angka di sebelah kanan ringkasan Tentang Saya.

      - name: "stats"
        label: "Angka Sorotan"
        icon: "tag"
        file: "content/stats.json"
        fields:
          - label: "Daftar angka"
            name: "items"
            widget: list
            collapsed: true
            minimize_collapsed: true
            label_singular: "Angka"
            summary: "{{fields.value}} {{fields.label.id}}"
            hint: "Tampil sebagai kartu kecil di section Tentang Saya."
            fields:
              - { label: "Angka", name: "value", widget: "string", hint: "Boleh dengan imbuhan, misalnya 16+ atau 3.84" }
              - label: "Keterangan"
                name: "label"
                widget: object
                collapsed: false
                required: true
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: true }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }
              - label: "Ikon"
                name: "icon"
                widget: select
                required: false
                hint: "Nama ikon dari daftar yang tersedia. Lihat data/README.md bagian 15."
                options: ["linkedin", "github", "instagram", "whatsapp", "mail", "x", "youtube", "facebook", "tiktok", "telegram", "scholar", "medium", "phone", "globe", "briefcase", "graduation-cap", "book", "newspaper", "pen-line", "folder", "award", "calendar", "clock", "tag", "image", "map-pin", "building", "users", "heart", "star", "sparkles", "shield", "code", "palette", "languages", "layers", "compass", "rocket"]

      # Kartu kecil di bawah angka sorotan, masih di bagian Tentang Saya.
      - name: "languages"
        label: "Bahasa yang Dikuasai"
        icon: "translate"
        file: "content/languages.json"
        fields:
          - label: "Daftar bahasa"
            name: "items"
            widget: list
            collapsed: true
            minimize_collapsed: true
            label_singular: "Bahasa"
            summary: "{{fields.name.id}}"
            hint: "Tampil sebagai kartu kecil di bagian Tentang Saya, di bawah angka sorotan."
            fields:
              - label: "Nama bahasa"
                name: "name"
                widget: object
                collapsed: false
                required: true
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: true }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }
              - label: "Tingkat kemampuan"
                name: "level"
                widget: object
                collapsed: false
                required: true
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: true }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }

      - name: "experience"
        label: "Pengalaman"
        icon: "work"
        file: "content/experience.json"
        fields:
          - label: "Daftar pengalaman"
            name: "items"
            widget: list
            collapsed: true
            minimize_collapsed: true
            label_singular: "Pengalaman"
            summary: "{{fields.role.id}}"
