      # ------------------------------------------------------------------------
      # GALERI
      #
      # Ini satu satunya bagian yang menerima banyak foto dalam sekali pilih.
      # Buka "Foto galeri", centang sebanyak apa pun di perpustakaan media,
      # lalu simpan. Urutannya bisa digeser dengan menyeret barisnya.
      #
      # Keterangan foto sengaja dipisah ke kolom tersendiri di bawahnya dan
      # sifatnya opsional. Sebagian besar foto galeri tidak butuh keterangan,
      # dan memaksa mengisinya satu per satu justru menghapus keuntungan dari
      # memilih banyak foto sekaligus.
      #
      # Bagian ini hilang sendiri dari situs kalau fotonya kosong.
      # ------------------------------------------------------------------------
      - name: "gallery"
        label: "Galeri"
        icon: "photo_library"
        file: "content/gallery.json"
        fields:
          - { label: "Tampilkan bagian Galeri", name: "enabled", widget: "boolean", default: true, required: false, hint: "Hilangkan centangnya untuk menyembunyikan seluruh bagian tanpa menghapus fotonya." }
          - label: "Jumlah kolom"
            name: "columns"
            widget: select
            default: "3"
            required: false
            hint: "Di ponsel selalu dua kolom, berapa pun pilihanmu di sini."
            options:
              - { label: "2 kolom, foto paling besar", value: "2" }
              - { label: "3 kolom", value: "3" }
              - { label: "4 kolom, foto paling banyak sekaligus", value: "4" }
          - label: "Bentuk foto"
            name: "ratio"
            widget: select
            default: "4/3"
            required: false
            hint: "Semua foto dipotong mengikuti bentuk ini supaya kisinya rapi."
            options:
              - { label: "Mendatar 4:3", value: "4/3" }
              - { label: "Persegi 1:1", value: "1/1" }
              - { label: "Lebar 16:9", value: "16/9" }
              - { label: "Tegak 3:4, cocok untuk foto ponsel", value: "3/4" }
          - label: "Foto dan video galeri"
            name: "photos"
            widget: file
            multiple: true
            required: false
            accept: "image/*,video/mp4,video/webm,video/quicktime"
            hint: "Pilih sebanyak apa pun sekaligus, foto maupun video. Seret barisnya untuk mengubah urutan tampil. Ini bagian Galeri tersendiri, bukan strip Sekilas Kegiatan yang ada di menu Tentang Saya."
          - label: "Keterangan dan sampul video (opsional)"
            name: "captions"
            widget: list
            required: false
            collapsed: true
            minimize_collapsed: true
            label_singular: "Keterangan"
            summary: "{{fields.text.id}}"
            hint: "Isi hanya untuk berkas yang perlu diberi keterangan atau sampul. Sisanya tetap tampil apa adanya."
            fields:
              - { label: "Berkasnya yang mana", name: "src", widget: "file", required: true, accept: "image/*,video/mp4,video/webm,video/quicktime", hint: "Pilih berkas yang sama dengan yang ada di daftar atas." }
              - label: "Keterangan"
                name: "text"
                widget: object
                collapsed: false
                required: false
                fields:
                  - { label: "Bahasa Indonesia", name: "id", widget: "string", required: false }
                  - { label: "English (opsional)", name: "en", widget: "string", required: false }
              # SAMPUL VIDEO
              #
              # Kotak video di kisi galeri sengaja tidak memuat videonya sendiri.
              # Kalau dimuat, peramban mengunduh tiap video di halaman itu hanya
              # untuk mencari gambar bingkai pertamanya, dan galeri berisi
              # selusin video bisa memakan puluhan megabita kuota pengunjung
              # sebelum satu pun ditonton.
              #
              # Isi kolom ini dengan satu foto kalau kamu ingin kotaknya
              # menampilkan gambar, bukan warna polos berikon film. Videonya
              # sendiri baru diunduh saat pengunjung menekannya.
              - { label: "Sampul video", name: "poster", widget: "image", required: false, hint: "Hanya untuk video. Foto yang tampil di kotaknya sebelum videonya dibuka." }

